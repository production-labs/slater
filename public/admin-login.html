<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slater Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', sans-serif; background: #f3f0ed; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .logo-text h1 { font-size: 22px; font-weight: 600; color: #222; }
    .logo-text p { font-size: 12px; color: #9D9D99; }
    label { display: block; font-size: 12px; font-weight: 500; color: #555; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; margin-bottom: 16px; outline: none; transition: border-color .2s; }
    input:focus { border-color: #222; }
    button { width: 100%; padding: 11px; background: #222; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer; }
    button:hover { background: #333; }
    .error { color: #D94B43; font-size: 13px; margin-bottom: 16px; display: none; }
    .back-link { text-align: center; margin-top: 20px; font-size: 13px; color: #9D9D99; }
    .back-link a { color: #222; text-decoration: none; font-weight: 500; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-text">
        <h1>Slater Admin</h1>
        <p>Production Labs LLC</p>
      </div>
    </div>
    <div class="error" id="error-msg"></div>
    <label>Admin Password</label>
    <input type="password" id="secret" placeholder="••••••••" autofocus>
    <button onclick="adminLogin()">Sign in</button>
    <div class="back-link"><a href="/login">Back to Slater</a></div>
  </div>
  <script>
    async function adminLogin() {
      var secret = document.getElementById('secret').value;
      var errEl = document.getElementById('error-msg');
      errEl.style.display = 'none';
      try {
        var r = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret: secret })
        });
        var data = await r.json();
        if (!r.ok) {
          errEl.textContent = data.error || 'Login failed';
          errEl.style.display = 'block';
          return;
        }
        window.location.href = '/admin';
      } catch (e) {
        errEl.textContent = 'Connection error';
        errEl.style.display = 'block';
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') adminLogin();
    });
  </script>
</body>
</html>
