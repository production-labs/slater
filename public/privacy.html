<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy | Production Labs</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f0ed; margin: 0; padding: 0; }
    .privacy-wrapper { max-width: 860px; margin: 40px auto; padding: 48px 24px 80px; background: #ffffff; border-radius: 12px; }
    h1, h2, h3 { margin-top: 1.2em; }
    bdt { display: contents; }
    bdt.block-component, bdt.statement-end-if-in-editor, bdt.else-block, bdt.forloop-component { display: none; }
	
	[data-custom-class='body'], [data-custom-class='body'] * {
			  background: transparent !important;
			}
	[data-custom-class='title'], [data-custom-class='title'] * {
			  font-family: Arial !important;
	font-size: 26px !important;
	color: #000000 !important;
			}
	[data-custom-class='subtitle'], [data-custom-class='subtitle'] * {
			  font-family: Arial !important;
	color: #595959 !important;
	font-size: 14px !important;
			}
	[data-custom-class='heading_1'], [data-custom-class='heading_1'] * {
			  font-family: Arial !important;
	font-size: 19px !important;
	color: #000000 !important;
			}
	[data-custom-class='heading_2'], [data-custom-class='heading_2'] * {
			  font-family: Arial !important;
	font-size: 17px !important;
	color: #000000 !important;
			}
	[data-custom-class='body_text'], [data-custom-class='body_text'] * {
			  color: #595959 !important;
	font-size: 14px !important;
	font-family: Arial !important;
			}
	[data-custom-class='link'], [data-custom-class='link'] * {
			  color: #3030F1 !important;
	font-size: 14px !important;
	font-family: Arial !important;
	word-break: break-word !important;
			}
			
			ul {
				list-style-type: square;
			  }
			  ul > li > ul {
				list-style-type: circle;
			  }
			  ul > li > ul > li > ul {
				list-style-type: square;
			  }
			  ol li {
				font-family: Arial ;
			  }
	
  </style>
</head>
<body>
<div class="privacy-wrapper">

	</div>
</body>
</html>
