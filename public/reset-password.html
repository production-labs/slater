<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slater — Reset password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #111111; color: #F7F5EF; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1A1A1A; border-radius: 12px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,.4); border: 1px solid #2E2E2E; }
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .logo-text h1 { font-size: 22px; font-weight: 600; color: #F7F5EF; }
    .logo-text p { font-size: 12px; color: #6E747B; }
    h2 { font-size: 18px; font-weight: 600; color: #F7F5EF; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: #6E747B; margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 500; color: #6E747B; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #2E2E2E; border-radius: 6px; font-size: 14px; font-family: inherit; margin-bottom: 16px; outline: none; transition: border-color .2s; background: #222222; color: #F7F5EF; }
    input:focus { border-color: #FF4D00; }
    button { width: 100%; padding: 11px; background: #FF4D00; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer; }
    button:hover { background: #e04000; }
    button:disabled { background: #6E747B; cursor: not-allowed; }
    .error { color: #FF4D00; font-size: 13px; margin-bottom: 16px; display: none; }
    .success { background: #1a3a2a; border: 1px solid #2a5a3a; border-radius: 6px; padding: 12px 14px; font-size: 13px; color: #4CAF77; margin-bottom: 16px; display: none; }
    .toggle-link { text-align: center; margin-top: 20px; font-size: 13px; color: #6E747B; }
    .toggle-link a { color: #F7F5EF; text-decoration: none; font-weight: 500; cursor: pointer; }
    .toggle-link a:hover { text-decoration: underline; }
    .invalid-token { text-align: center; }
    .invalid-token p { font-size: 14px; color: #6E747B; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-text">
        <h1>Slater</h1>
        <p>The producer's toolbox</p>
      </div>
    </div>

    <div id="invalid-token-msg" class="invalid-token" style="display:none;">
      <h2>Invalid link</h2>
      <p style="margin-top:8px;">This reset link is invalid. Please request a new one.</p>
      <a href="/login" style="display:inline-block;margin-top:8px;color:#F7F5EF;font-size:13px;font-weight:500;">Back to sign in</a>
    </div>

    <div id="reset-form">
      <h2>Reset your password</h2>
      <p class="subtitle">Enter your new password below.</p>
      <div class="error" id="error-msg"></div>
      <div class="success" id="success-msg">Password updated! Redirecting to sign in...</div>
      <label>New password</label>
      <input type="password" id="new-password" placeholder="At least 8 characters" autofocus>
      <label>Confirm password</label>
      <input type="password" id="confirm-password" placeholder="••••••••">
      <button id="submit-btn" onclick="resetPassword()">Set new password</button>
      <div class="toggle-link"><a href="/login">Back to sign in</a></div>
    </div>
  </div>
  <script>
    var token = null;

    (function() {
      var params = new URLSearchParams(window.location.search);
      token = params.get('token');
      if (!token) {
        document.getElementById('reset-form').style.display = 'none';
        document.getElementById('invalid-token-msg').style.display = 'block';
      }
    })();

    async function resetPassword() {
      var password = document.getElementById('new-password').value;
      var confirm = document.getElementById('confirm-password').value;
      var errEl = document.getElementById('error-msg');
      var successEl = document.getElementById('success-msg');
      var btn = document.getElementById('submit-btn');

      errEl.style.display = 'none';
      successEl.style.display = 'none';

      if (!password) {
        errEl.textContent = 'Please enter a new password.';
        errEl.style.display = 'block';
        return;
      }
      if (password.length < 8) {
        errEl.textContent = 'Password must be at least 8 characters.';
        errEl.style.display = 'block';
        return;
      }
      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        var r = await fetch('/api/users/reset-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({token: token, password: password})
        });
        var data = await r.json();
        if (!r.ok) {
          errEl.textContent = data.error || 'Failed to reset password.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Set new password';
          return;
        }
        successEl.style.display = 'block';
        btn.style.display = 'none';
        document.getElementById('new-password').disabled = true;
        document.getElementById('confirm-password').disabled = true;
        setTimeout(function() {
          window.location.href = '/login';
        }, 2000);
      } catch(e) {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Set new password';
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && token) {
        resetPassword();
      }
    });
  </script>
<div style="text-align:center;padding:12px;font-size:11px;color:#6E747B;border-top:1px solid #2E2E2E">
  <a href="#" target="_blank" style="color:#6E747B;text-decoration:underline;margin:0 8px">Privacy Policy</a>
  <a href="#" target="_blank" style="color:#6E747B;text-decoration:underline;margin:0 8px">Terms of Service</a>
  <a href="#" target="_blank" style="color:#6E747B;text-decoration:underline;margin:0 8px">Refund Policy</a>
</div>
</body>
</html>
